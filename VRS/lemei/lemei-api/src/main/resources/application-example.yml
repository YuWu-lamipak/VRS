# ========================================
# 乐美车辆预约系统 - API 模块配置示例
# ========================================
# 
# 使用说明：
# 1. 复制此文件为 application-dev.yml（开发环境）或 application-prod.yml（生产环境）
# 2. 填写实际的配置值
# 3. 不要将包含真实密码的配置文件提交到 Git 仓库
#
# ========================================

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      # 主库数据源
      master:
        # 数据库连接地址（请替换为实际值）
        url: jdbc:mysql://YOUR_DB_HOST:3306/YOUR_DB_NAME?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
        # 数据库用户名（请替换为实际值）
        username: YOUR_DB_USERNAME
        # 数据库密码（请替换为实际值）
        password: YOUR_DB_PASSWORD
      
      # 从库数据源（如果有）
      slave:
        enabled: false
        url:
        username:
        password:
      
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      
      webStatFilter:
        enabled: true
      
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码（请替换为实际值）
        login-username: YOUR_DRUID_USERNAME
        login-password: YOUR_DRUID_PASSWORD
      
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true

  # Redis 配置
  redis:
    # 地址（请替换为实际值）
    host: YOUR_REDIS_HOST
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码（如果有，请替换为实际值）
    password: YOUR_REDIS_PASSWORD
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# ESB 配置（请替换为实际值）
ESB:
  ip: YOUR_ESB_IP
