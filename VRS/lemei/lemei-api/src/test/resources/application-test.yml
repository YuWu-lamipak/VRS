# 测试环境配置
spring:
  profiles:
    active: test
  
  # 数据源配置 - 使用 H2 内存数据库进行测试
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    
  # JPA 配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    
  # Redis 配置 - 使用嵌入式 Redis 或禁用
  redis:
    host: localhost
    port: 6379
    timeout: 10000
    
# 日志配置
logging:
  level:
    root: WARN
    com.lemei: INFO
    
# 禁用某些自动配置以加快测试速度
management:
  health:
    redis:
      enabled: false
